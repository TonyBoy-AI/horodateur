name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Write signing key to file
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $env:SIGNING_KEY | Out-File -FilePath "$env:RUNNER_TEMP\tauri-signing.key" -Encoding UTF8 -NoNewline
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$env:RUNNER_TEMP\tauri-signing.key" >> $env:GITHUB_ENV

      - name: Build Tauri
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List bundle files
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle/ | Select-Object FullName
        shell: pwsh

      - name: Upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Horodateur ${{ github.ref_name }}'
          releaseBody: 'Nouvelle version de Horodateur.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: false
